name: Leads — LinkedIn sweep

# LinkedIn's half of the source-split pipeline (2026-08-14). Every 2 hours:
# the statewide instant tier completes across two runs (~4h worst-case
# freshness); whatever budget remains inside each run goes to the city
# recall tier. Collect-only — qualify runs hourly on the Indeed workflow and
# drains both boards' postings there.
#
# TRANSITION COPY (2026-08-15): this file lives on main only so GitHub
# registers its schedule (crons fire from the default branch alone), but it
# checks out and runs the STAGING branch — the new dimension-model pipeline
# — while the old matrix pipeline (leads.yml) stays retired from schedule.
# When staging is promoted, the merge takes staging's copy, which drops the
# `ref: staging` pin and runs main's own code.
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
    inputs:
      budget-minutes:
        description: 'Collect wall-clock budget (minutes)'
        default: '35'

concurrency:
  group: leads-linkedin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo (staging pipeline)
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LinkedIn sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAD_COMPANY_ID: ${{ secrets.LEAD_COMPANY_ID }}
        run: |
          python scripts/run_leads.py \
            --stage collect \
            --sources linkedin \
            --budget-minutes "${{ github.event.inputs.budget-minutes || '35' }}" \
            --verbose
