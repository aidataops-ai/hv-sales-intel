name: Lead Pipeline

# Manual dispatch only — the scheduled sweeps live in leads-indeed.yml and
# leads-linkedin.yml (one workflow per board, split 2026-08-14 so each source
# gets its own full budget, cadence, and failure isolation). This file stays
# for two callers:
#   - the app's manual "retrigger" endpoint (settings.github_leads_workflow
#     dispatches THIS file), and
#   - hand-run backfills/debug sweeps, where picking a stage, a source
#     subset, and a budget in one place beats juggling two workflows.
#
# Collect is a wall-clock budget, not a target count (instant-signals
# refactor, Phase 2): it claims the stalest due location per source one at a
# time, crosses it with every enabled term, and stamps only once the
# location's sweep finishes. See docs/refactor/instant-signals-targets.md §3.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Pipeline stage to run'
        type: choice
        default: both
        options: [both, collect, qualify]
      sources:
        description: 'Job boards to sweep'
        type: choice
        default: both
        options: [both, indeed, linkedin]
      budget-minutes:
        description: 'Collect wall-clock budget (minutes)'
        default: '40'

concurrency:
  group: leads-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lead pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LEAD_COMPANY_ID: ${{ secrets.LEAD_COMPANY_ID }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'both' }}"
          EXTRA=""
          if [ "$SOURCES" != "both" ]; then
            EXTRA="--sources $SOURCES"
          fi
          python scripts/run_leads.py \
            --stage "${{ github.event.inputs.stage || 'both' }}" \
            --budget-minutes "${{ github.event.inputs.budget-minutes || '40' }}" \
            $EXTRA \
            --verbose
