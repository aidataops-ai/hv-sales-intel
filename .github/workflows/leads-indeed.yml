name: Leads — Indeed sweep

# Indeed's half of the source-split pipeline (2026-08-14). Hourly, with the
# full collect budget to itself. Qualify rides on this job (not the LinkedIn
# one) because it runs hourly: one qualifier drain per hour covers both
# boards' collected postings without two jobs racing to claim the same
# unqualified rows.
#
# TRANSITION COPY (2026-08-15): this file lives on main only so GitHub
# registers its schedule (crons fire from the default branch alone), but it
# checks out and runs the STAGING branch — the new dimension-model pipeline
# — while the old matrix pipeline (leads.yml) stays retired from schedule.
# When staging is promoted, the merge takes staging's copy, which drops the
# `ref: staging` pin and runs main's own code.
#
# The cron fires at :17, not :00 — GitHub's scheduler is most congested on
# the hour and silently skips congested slots (the previous on-the-hour cron
# delivered ~18 of 24 runs/day).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      budget-minutes:
        description: 'Collect wall-clock budget (minutes)'
        default: '40'

concurrency:
  group: leads-indeed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo (staging pipeline)
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Indeed sweep + qualify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LEAD_COMPANY_ID: ${{ secrets.LEAD_COMPANY_ID }}
        run: |
          python scripts/run_leads.py \
            --stage both \
            --sources indeed \
            --budget-minutes "${{ github.event.inputs.budget-minutes || '40' }}" \
            --verbose
